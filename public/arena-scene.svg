 <g fill="#d5f3ff" opacity=".32">
  <circle cx="90" cy="278" r="3"/><circle cx="122" cy="288" r="2"/><circle cx="162" cy="270" r="3"/><circle cx="205" cy="303" r="2"/><circle cx="255" cy="281" r="3"/><circle cx="318" cy="294" r="2"/><circle cx="370" cy="272" r="3"/><circle cx="425" cy="306" r="2"/><circle cx="482" cy="283" r="3"/><circle cx="535" cy="299" r="2"/><circle cx="598" cy="276" r="3"/><circle cx="660" cy="302" r="2"/><circle cx="720" cy="280" r="3"/><circle cx="775" cy="300" r="2"/><circle cx="835" cy="276" r="3"/><circle cx="890" cy="304" r="2"/><circle cx="950" cy="282" r="3"/><circle cx="1010" cy="300" r="2"/><circle cx="1070" cy="276" r="3"/><circle cx="1120" cy="293" r="2"/>
 </g>
