name: Deploy iPhone web playtest

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'package.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'src/**'
      - 'public/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build web playtest
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Remove stale Pages artifacts from this run
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            for (const artifact of data.artifacts) {
              if (artifact.name === 'github-pages') {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
              }
            }
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Wait until Pages artifact is visible to the deployment API
        uses: actions/github-script@v7
        with:
          script: |
            let visible = false;
            for (let attempt = 1; attempt <= 12; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
              });
              const pages = data.artifacts.filter((artifact) => artifact.name === 'github-pages' && !artifact.expired);
              core.info(`Artifact visibility check ${attempt}/12: found ${pages.length}`);
              if (pages.length === 1) {
                visible = true;
                break;
              }
              if (pages.length > 1) {
                throw new Error(`Expected one github-pages artifact, found ${pages.length}`);
              }
              await new Promise((resolve) => setTimeout(resolve, 5000));
            }
            if (!visible) {
              throw new Error('github-pages artifact did not become visible after 60 seconds');
            }
            core.info('Artifact is listed. Waiting 15 seconds for Pages deployment API propagation.');
            await new Promise((resolve) => setTimeout(resolve, 15000));
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
