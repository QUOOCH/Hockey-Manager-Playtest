 <text x="140" y="47" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="5" fill="#a8e6ff">HOME ARENA</text>
 <text x="140" y="78" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="900" letter-spacing="4" fill="#f4fbff">PUCK IT!</text>
