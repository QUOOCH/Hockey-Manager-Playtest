# Manual refresh trigger: fetch the newest completed match from D1.
name: Sync latest PUCK IT match logs

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-match-logs.yml"

permissions:
  contents: read

concurrency:
  group: sync-match-logs
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch latest matches from Cloudflare D1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            "https://little-morning-b296.bratskiymax0.workers.dev/telemetry/matches?limit=3" \
            -o latest-matches.json
          python - <<'PY'
          import json
          with open("latest-matches.json", encoding="utf-8") as f:
              data = json.load(f)
          if not data.get("ok"):
              raise SystemExit("Cloudflare did not confirm a successful response")
          print(f"Retrieved {data.get('count', 0)} match(es) from D1")
          with open("match-log-summary.txt", "w", encoding="utf-8") as f:
              f.write(f"Matches available: {data.get('count', 0)}\\n")
              for item in data.get("matches", []):
                  match = item.get("match", {})
                  f.write(
                      f"{item.get('createdAt', item.get('created_at', 'unknown'))} | "
                      f"{match.get('home', '?')} vs {match.get('away', '?')} | "
                      f"{match.get('score', '?')}\\n"
                  )
          PY
      - name: Publish logs for assistant analysis
        uses: actions/upload-artifact@v4
        with:
          name: puck-it-latest-match-logs
          path: |
            latest-matches.json
            match-log-summary.txt
          if-no-files-found: error
          retention-days: 7
