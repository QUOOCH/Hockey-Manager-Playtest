name: Deploy TRELLIS Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/trellis-proxy/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trellis-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply match log database schema
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/trellis-proxy
          command: d1 execute puck-it-match-logs --remote --file=./schema.sql
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/trellis-proxy
          command: deploy
