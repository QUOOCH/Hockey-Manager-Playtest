<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="Атмосферная хоккейная арена перед матчем">
<defs>
 <linearGradient id="ceiling" x2="0" y2="1"><stop stop-color="#081522"/><stop offset=".55" stop-color="#142d43"/><stop offset="1" stop-color="#091b2b"/></linearGradient>
 <linearGradient id="upper" x2="0" y2="1"><stop stop-color="#27445b"/><stop offset=".48" stop-color="#102a40"/><stop offset="1" stop-color="#071725"/></linearGradient>
 <linearGradient id="lower" x2="0" y2="1"><stop stop-color="#45677d"/><stop offset=".32" stop-color="#17374f"/><stop offset="1" stop-color="#071827"/></linearGradient>
 <linearGradient id="glass" x2="0" y2="1"><stop stop-color="#c7f3ff" stop-opacity=".38"/><stop offset=".6" stop-color="#79c9ed" stop-opacity=".11"/><stop offset="1" stop-color="#8bdfff" stop-opacity=".02"/></linearGradient>
 <linearGradient id="boards" x2="0" y2="1"><stop stop-color="#f5fcff"/><stop offset=".58" stop-color="#b8d9e8"/><stop offset="1" stop-color="#527b94"/></linearGradient>
 <linearGradient id="ice" x2=".15" y2="1"><stop stop-color="#f8fdff"/><stop offset=".35" stop-color="#c9e9f5"/><stop offset=".72" stop-color="#8dbed2"/><stop offset="1" stop-color="#477f9b"/></linearGradient>
 <linearGradient id="redline" x2="0" y2="1"><stop stop-color="#ff8b9d"/><stop offset=".5" stop-color="#c72d4b"/><stop offset="1" stop-color="#751b35"/></linearGradient>
 <radialGradient id="iceGlow"><stop stop-color="#fff" stop-opacity=".9"/><stop offset=".38" stop-color="#b8efff" stop-opacity=".4"/><stop offset="1" stop-color="#8bdfff" stop-opacity="0"/></radialGradient>
 <radialGradient id="lamp"><stop stop-color="#fff"/><stop offset=".12" stop-color="#e7fbff"/><stop offset=".4" stop-color="#8de0ff" stop-opacity=".45"/><stop offset="1" stop-color="#8de0ff" stop-opacity="0"/></radialGradient>
 <filter id="blur20"><feGaussianBlur stdDeviation="20"/></filter>
 <filter id="blur7"><feGaussianBlur stdDeviation="7"/></filter>
 <filter id="shadow"><feGaussianBlur stdDeviation="13"/></filter>
